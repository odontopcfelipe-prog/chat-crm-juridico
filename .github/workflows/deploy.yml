name: Build and Push to Docker Hub

on:
  push:
    branches:
      - master  # main e mantida apenas como mirror — CI roda so em master
  workflow_dispatch:  # permite acionar manualmente pelo GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Onda 6 — desliga fail-fast: se um job falhar (ex.: worker), os outros
    # (api/web) continuam buildando. Antes 1 flake derrubava os 3.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/Dockerfile.backend
            suffix: api
            build-args: APP=api
          - name: worker
            dockerfile: infra/Dockerfile.backend
            suffix: worker
            build-args: APP=worker
          - name: web
            dockerfile: infra/Dockerfile.web
            suffix: web
            build-args: |
              NEXT_PUBLIC_API_URL=https://sistema.institutoodontopassos.com.br/api
              NEXT_PUBLIC_WS_URL=wss://sistema.institutoodontopassos.com.br
              NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          # Publica :latest (deploy padrão) e :<sha> (deploy determinístico/rollback).
          # A tag por commit permite `vps-redeploy.sh <sha>` apontar exatamente o build certo.
          tags: |
            odontopassos/chat-crm-juridico-${{ matrix.suffix }}:latest
            odontopassos/chat-crm-juridico-${{ matrix.suffix }}:${{ github.sha }}
          no-cache: true

  # Espelha master -> main apos o build do Docker passar.
  # Mantem main alinhada sem rodar Docker build duas vezes (main nao
  # esta nos triggers acima). Aparece como step deste workflow — nao
  # como workflow separado na lista.
  mirror-to-main:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main || git branch main origin/master
          git checkout main
          # Idempotente: nao falha se main ja esta sincronizado (caso o
          # operador tenha pushado nas duas branches manualmente, ver MEMORY.md).
          git merge --ff-only origin/master || echo "Main already up to date"
          git push origin main || echo "Nothing to push"

  # Deploy manual via Claude Code na VPS após o build — sem SSH automático aqui
  # para manter controle sobre o momento de aplicar em produção.
