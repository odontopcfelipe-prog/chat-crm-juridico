name: Mirror master to main

# Espelha master -> main automaticamente apos cada push em master.
# Mantem as duas branches alinhadas sem rodar Docker build duas vezes
# (deploy.yml so dispara em master).
#
# Se houver divergencia (main com commits proprios), o push falha e
# o usuario precisa resolver manualmente.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main || git branch main origin/master
          git checkout main
          git merge --ff-only origin/master
          git push origin main
